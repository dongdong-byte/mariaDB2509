<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>데이터 조회</title>
    <style>
        body { padding: 30px; font-family: sans-serif; }
        h2 { border-bottom: 2px solid #333; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .back-btn { display: inline-block; padding: 10px 20px; background-color: #555; color: white; text-decoration: none; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>
<a href="/" class="back-btn">⬅ 메인으로 돌아가기</a>

<h2>📋 <span th:text="${tableName}"></span> Data</h2>

<div th:if="${#lists.isEmpty(dataList)}">
    <p>데이터가 없습니다.</p>
</div>

<table th:if="${not #lists.isEmpty(dataList)}">
    <thead>
    <tr>
        <th th:each="col : ${columns}" th:text="${col}"></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="row : ${dataList}">
        <td th:each="col : ${columns}" th:text="${row.get(col)}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
