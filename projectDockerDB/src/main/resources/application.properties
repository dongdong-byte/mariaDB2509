spring.application.name=projectDockerDB

# 1. DB 연결 URL (mysql -> mariadb로 변경)
# docker-compose 등을 쓸 때 서비스명이 'car-db'라면 아래처럼 유지하되 프로토콜만 바꿉니다.
# 만약 로컬에서 테스트 중이라면 car-db 대신 localhost를 써야 할 수도 있습니다.
#spring.datasource.url=jdbc:mariadb://localhost:3306/projecttest2
#spring.datasource.url=jdbc:mariadb://car-db:3306/projecttest2?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8
# 2. DB 유저 정보 (기존 유지)
#spring.datasource.username=root
#spring.datasource.password=1234

# 3. Driver Class Name (가장 중요! mysql -> mariadb로 변경)
#spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# 4. (선택) 하이버네이트 방언 설정 (혹시 설정되어 있다면)
# spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialectpper=DEBUG
# 1. DB 연결 주소 (localhost:3306/DB이름)
spring.datasource.url=jdbc:mariadb://localhost:3306/car_rental?serverTimezone=Asia/Seoul&characterEncoding=UTF-8

# 2. 아이디와 비밀번호 (yml 파일에서 설정한 값)
spring.datasource.username=root
spring.datasource.password=root

# 3. 마리아DB 드라이버 설정
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# (선택) SQL 실행 로그를 보고 싶다면 추가
mybatis.configuration.map-underscore-to-camel-case=true
logging.level.root=info